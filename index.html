<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework: Energy</title>
    <style>
        /* Base page styling */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }

        /* Headings styling */
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        h2 {
            color: #7f8c8d;
            font-weight: normal;
            margin-bottom: 40px;
        }

        /* Button container spacing */
        .nav-container {
            margin-top: 20px;
        }

        /* Styling links to look like interactive buttons */
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 12px 24px;
            margin: 10px;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }

        /* Unique colors for different button types */
        .btn-non {
            background-color: #e74c3c;
            color: white;
        }

        .btn-non:hover {
            background-color: #c0392b;
        }

        .btn-renewable {
            background-color: #2ecc71;
            color: white;
        }

        .btn-renewable:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <h1 style="font-size: 60px">Energy</h1>
    <h2>Renewable and Non-Renewable</h2>
    <h3>Click the topic you want to learn about</h3>
    <div class="nav-container">
        <a href="/non/index.html" class="btn btn-non">Non-Renewable</a>
        <a href="/renewable/index.html" class="btn btn-renewable">Renewable</a>
    </div>
    <img src="https://thermohouse.co.uk/wp-content/uploads/2019/04/Renewables-vs-Non-Renewables.jpg" alt="Description" style="max-width: 100%; height: auto;">
